
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f2a20">

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🌿</text></svg>"
    >

    <link rel="stylesheet" href="css/style.css">

    <script src="js/main.js" defer></script>

    <meta
        name="description"
        content="Peça um orçamento à JRV Paisagismo pelo formulário ou pelo WhatsApp."
    >

    <title>Contato | JRV Paisagismo</title>
</head>

<body>

    <div id="topo"></div>

    <main>

        <div class="topo">
            <div class="wrap">

                <h1>Peça seu orçamento</h1>

                <p>
                    Preencha os dados e continue a conversa pelo WhatsApp.
                </p>

            </div>
        </div>

        <section>
            <div class="wrap">

                <form id="f" novalidate>

                    <div>
                        <label for="nome">Nome</label>

                        <input
                            id="nome"
                            name="nome"
                            autocomplete="name"
                        >

                        <div
                            class="err"
                            id="e-nome"
                            role="alert"
                        ></div>
                    </div>

                    <div>
                        <label for="telefone">Telefone com DDD</label>

                        <input
                            id="telefone"
                            name="telefone"
                            type="tel"
                            autocomplete="tel"
                        >

                        <div
                            class="err"
                            id="e-telefone"
                            role="alert"
                        ></div>
                    </div>

                    <div>
                        <label for="email">E-mail</label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                        >

                        <div
                            class="err"
                            id="e-email"
                            role="alert"
                        ></div>
                    </div>

                    <div>
                        <label for="servico">Serviço desejado</label>

                        <select id="servico" name="servico">

                            <option value="">Selecione</option>
                            <option>Implantação de jardins</option>
                            <option>Manutenção de jardins</option>
                            <option>Podas</option>
                            <option>Limpeza de terrenos</option>
                            <option>Consultoria paisagística</option>

                        </select>

                        <div
                            class="err"
                            id="e-servico"
                            role="alert"
                        ></div>
                    </div>

                    <div>
                        <label for="mensagem">Mensagem</label>

                        <textarea
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                        ></textarea>

                        <div
                            class="err"
                            id="e-mensagem"
                            role="alert"
                        ></div>
                    </div>

                    <div>

                        <button
                            class="btn"
                            type="submit"
                            style="margin:0"
                        >
                            Enviar pelo WhatsApp
                        </button>

                        <a
                            class="btn sec"
                            data-wa
                            href="#"
                            style="color:var(--folha);border-color:var(--folha);margin:0 0 0 8px"
                        >
                            Chamar direto
                        </a>

                    </div>

                    <p
                        class="ok"
                        id="ok"
                        role="status"
                        hidden
                    >
                        Tudo certo! Abrimos o WhatsApp com a sua mensagem pronta; é só enviar.
                    </p>

                </form>

            </div>
        </section>

        <script>
            addEventListener("DOMContentLoaded", () => {

                const s = new URLSearchParams(location.search).get("s");
                const e = document.getElementById("servico");

                if (s) {
                    e.value = s;
                }

            });
        </script>

    </main>

    <div id="rodape"></div>

</body>
</html>
